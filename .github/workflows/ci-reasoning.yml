name: CI (Pluggable reasoning models)

# Validates the folder-discovered reasoning-model system fully offline: discovery,
# adapter loading, policy routing, the example model, and the generic API router.
# No network or Azure credentials are required (the Azure adapter is never called).
on:
  push:
    branches: [main]
    paths:
      - "dvsa_api/reasoning/**"
      - "dvsa_api/api/reasoning_router.py"
      - "models/reasoning/**"
      - "tests/test_reasoning_registry.py"
      - "tests/test_reasoning_api.py"
      - "tests/test_example_model.py"
      - "requirements-dev.txt"
      - ".github/workflows/ci-reasoning.yml"
  pull_request:

jobs:
  reasoning-tests:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings.testing
      # Keep any Azure-backed model strictly offline in CI.
      AZURE_REASONING_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          # Match core CI: base.txt pins ipython==9.2.0 which needs py>=3.11.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements/base.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (flake8)
        run: |
          flake8 dvsa_api/reasoning dvsa_api/api/reasoning_router.py \
            models/reasoning \
            tests/test_reasoning_registry.py \
            tests/test_reasoning_api.py \
            tests/test_example_model.py \
            --max-line-length=100 --extend-ignore=E203,W503

      - name: Run reasoning tests (offline)
        run: |
          pytest -q -p no:cacheprovider --no-cov \
            tests/test_reasoning_registry.py \
            tests/test_example_model.py \
            tests/test_reasoning_api.py
