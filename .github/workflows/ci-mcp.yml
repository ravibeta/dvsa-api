name: CI (MCP control plane)

# Validates the Multi-Agent Control Plane entirely offline: unit + integration
# tests run the in-memory runtime with the example agents and the simulator; no
# Docker/Redis/Kafka and no network are required. Containerized-agent tests are
# optional and gated behind a --docker flag (not run here).
on:
  push:
    branches: [main]
    paths:
      - "dvsa_api/mcp/**"
      - "dvsa_api/api/mcp_router.py"
      - "mcp/**"
      - "scripts/mcp_cli.py"
      - "tests/test_mcp_*.py"
      - "tests/test_example_agents.py"
      - "requirements-dev.txt"
      - ".github/workflows/ci-mcp.yml"
  pull_request:

jobs:
  mcp-tests:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings.testing
      ENABLE_MCP: "true"
      MCP_HUMAN_AUTO_CONFIRM: "1"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          # Match the other CI jobs: base.txt pins ipython==9.2.0 (needs py>=3.11).
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements/base.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (flake8)
        run: |
          flake8 dvsa_api/mcp dvsa_api/api/mcp_router.py \
            mcp/agents mcp/simulators scripts/mcp_cli.py \
            tests/test_mcp_registry.py tests/test_mcp_planner.py \
            tests/test_mcp_executor.py tests/test_example_agents.py \
            tests/test_mcp_mission_flow.py \
            --max-line-length=100 --extend-ignore=E203,W503

      - name: Validate agent manifests
        run: |
          python - <<'PY'
          from dvsa_api.mcp import registry
          names = registry.discover_agents(force=True)
          assert names, "no agents discovered"
          for m in registry.list_manifests():
              agent = registry.get_agent(m.name)
              assert agent.health_check().get("status") == "ok", m.name
              assert m.capabilities, f"{m.name} declares no capabilities"
          print("validated agents:", names)
          PY

      - name: Run MCP unit + integration tests (offline)
        run: |
          pytest -q -p no:cacheprovider --no-cov \
            tests/test_mcp_registry.py \
            tests/test_mcp_planner.py \
            tests/test_mcp_executor.py \
            tests/test_example_agents.py \
            tests/test_mcp_mission_flow.py
