name: CI (agent kits)

# Validates the DVSA Agent Kits entirely offline: lint, schema export, unit tests
# across all four kits, a cloud-runner Docker build, and smoke tests that exercise
# the local harness, the cloud runner (served locally), and the orchestrator. No
# external cloud services; all network traffic is mocked. Target: < 5 minutes.
on:
  push:
    branches: [main]
    paths:
      - "agent_kits/**"
      - ".github/workflows/ci-agent-kits.yml"
  pull_request:
    paths:
      - "agent_kits/**"
      - ".github/workflows/ci-agent-kits.yml"

jobs:
  agent-kits-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent_kits/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest==8.3.4 flake8==7.1.1 uvicorn==0.30.6
          pip install -r agent_kits/requirements.txt

      - name: Lint (flake8)
        run: |
          flake8 agent_kits --max-line-length=100 --extend-ignore=E203,W503

      - name: Validate schemas export
        run: |
          python - <<'PY'
          from agent_kits.common import export_schemas
          schemas = export_schemas()
          assert set(schemas) == {"RunInput", "Detection", "RunOutput"}, schemas
          assert "video_uri" in schemas["RunInput"]["required"]
          for name, schema in schemas.items():
              assert schema["type"] == "object", name
              assert schema["properties"], name
          print("schemas OK:", sorted(schemas))
          PY

      - name: Generate synthetic test asset (fallback)
        run: |
          python agent_kits/test_assets/generate_synthetic_video.py \
            --out agent_kits/test_assets/sample_short.json

      - name: Run agent-kits unit tests (offline)
        run: |
          pytest agent_kits -o addopts="" -p no:cacheprovider -q

      - name: Build cloud-runner Docker image
        run: |
          docker build -f agent_kits/cloud_autonomous/Dockerfile \
            -t dvsa-agent-runner:ci .

      - name: Smoke — local harness (dry-run + run)
        run: |
          VIDEO=agent_kits/test_assets/sample_short.json
          python -m agent_kits.local_interactive.cli_wrapper --dry-run \
            run --video "$VIDEO" --fps 5
          python -m agent_kits.local_interactive.cli_wrapper \
            run-inference --video "$VIDEO" --fps 5 > /dev/null

      - name: Smoke — orchestrator partitions + merges
        run: |
          python -m agent_kits.orchestration.parent_orchestrator \
            --video agent_kits/test_assets/sample_short.json \
            --windows 3 --overlap 0.15 --out /tmp/merged.json > /dev/null
          python - <<'PY'
          import json
          data = json.load(open("/tmp/merged.json"))
          assert data["merged"]["detections"], "no merged detections"
          assert data["merged"]["summary"]["partitions_merged"] == 3
          print("orchestrator merged", len(data["merged"]["detections"]), "detections")
          PY

      - name: Smoke — cloud runner serves requests locally
        run: |
          uvicorn agent_kits.cloud_autonomous.cloud_runner:app --port 8080 &
          SERVER_PID=$!
          for i in $(seq 1 20); do
            curl -sf localhost:8080/healthz && break || sleep 0.5
          done
          curl -sf localhost:8080/run -H 'content-type: application/json' \
            -d '{"video_uri":"agent_kits/test_assets/sample_short.json","processing_flags":{"fps":5}}' \
            | python -c "import sys,json; d=json.load(sys.stdin); assert d['detections']; print('runner OK:', len(d['detections']), 'detections')"
          curl -sf localhost:8080/metrics | grep dvsa_runner_runs_total
          kill $SERVER_PID
